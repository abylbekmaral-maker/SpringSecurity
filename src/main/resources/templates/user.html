<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Spring Security Example</title>
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        USER
    </span>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-link text-secondary text-decoration-none"
                type="submit">
            Logout
        </button>
    </form>
</nav>
<div class="container-fluid">
    <div class="row">

        <div class="col-2 bg-white min-vh-100 pt-3">

            <div class="nav flex-column nav-pills">

                <a class="nav-link active"
                   th:href="@{/user}">
                    User
                </a>

            </div>
        </div>
        <div class="col-10 bg-light p-4">
            <h1 class="fw-bold">User Information Page</h1>

            <div class="card shadow-sm border-0 mt-4">

                <div class="card-body">

                    <h4 class="mb-4 fw-semibold">
                        About User
                    </h4>

                    <table class="table align-middle">

                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Username</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr>
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.name}"></td>
                            <td th:text="${user.lastName}"></td>
                            <td th:text="${user.age}"></td>
                            <td th:text="${user.username}"></td>
                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>

        </div>
    </div>
 </div>
</body>
</html>
