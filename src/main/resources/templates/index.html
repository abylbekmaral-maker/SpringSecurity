<script>

    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
    async function loadUsers() {

        const response = await fetch('/api/users', {
        headers: {[csrfHeader]: csrfToken } });
        const users = await response.json();
        const table = document.getElementById('usersTable');
        table.innerHTML = '';
        for (const u of users) {
         const row = document.createElement('tr');
        row.innerHTML = `
          <td>${u.id}</td>
          <td>${u.name}</td>
          <td>${u.lastName}</td>
          <td>${u.age}</td>
          <td>${u.username}</td>

       <td>
            ${u.roles.join(' ')}
       </td>

     <td>
        <button onclick="deleteUser(${u.id})">
            Delete
        </button>
     </td>

      <td>
        <button onclick="editUser(${u.id})">
                Edit
        </button>
      </td>
      `;
            table.appendChild(row);
         }

    }

    async function deleteUser(id) {

        await fetch('/api/users/' + id, {
            method: 'DELETE',
            headers: {[csrfHeader]: csrfToken
            }
        });

       loadUsers();
    }
    async function editUser(id) {

     const response = await fetch('/api/users/' + id, {
        headers: {[csrfHeader]: csrfToken }
    });
    const user = await response.json();

    document.querySelector('[name="id"]').value = user.id;
    document.querySelector('[name="name"]').value = user.name;
    document.querySelector('[name="lastName"]').value = user.lastName;
    document.querySelector('[name="age"]').value = user.age;
    document.querySelector('[name="username"]').value = user.username;
    }

   document.getElementById('userForm')
    .addEventListener('submit', async function (e) {

        e.preventDefault();

        const id = document.querySelector('[name="id"]').value;

        const user = {
            name: document.querySelector('[name="name"]').value,
            lastName: document.querySelector('[name="lastName"]').value,
            age: document.querySelector('[name="age"]').value,
            username: document.querySelector('[name="username"]').value,
            password: document.querySelector('[name="password"]').value,

            roleIds: Array.from(
                document.getElementById('roles').selectedOptions
            ).map(option => Number(option.value))
        };

        const url = id
            ? '/api/users/' + id
            : '/api/users';

        const method = id
            ? 'PUT'
            : 'POST';

        if (user.roleIds.length === 0) {
            alert('Please select at least one role');
            return;
        }

        if (!id && user.password.trim() === '') {
        alert('Please enter password');
        return;
           }

        await fetch(url, {
            method: method,

            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },

            body: JSON.stringify(user)
        });

        loadUsers();

        this.reset();
    });
            loadUsers();

</script>
