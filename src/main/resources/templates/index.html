<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Security Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
          ADMIN
    </span>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-link text-secondary text-decoration-none"
                type="submit">
            Logout
        </button>
    </form>
</nav>
<div class="container-fluid">
    <div class="row" >
        <div class="col-2 bg-white min-vh-100 pt-3">

            <div class="nav flex-column nav-pills">

                <a class="nav-link active"
                   th:href="@{/admin}">
                    Admin
                </a>

                <a class="nav-link"
                   th:href="@{/user}">
                    User
                </a>

            </div>
        </div>

        <div class="col-10 bg-light p-4">

<h1>Welcome to Index PAGE!</h1>

<h2>Edit User</h2>

<form th:action="@{/admin/save}" method="post">

    <input type="hidden" name="id" th:value="${user.id}">

    Name:
    <input type="text" name="name" th:value="${user.name}" class="form-control"><br>

    Last Name:
    <input type="text" name="lastName" th:value="${user.lastName}" class="form-control"><br>

    Age:
    <input type="number" name="age" th:value="${user.age}" class="form-control"><br>

    <button type="submit">Add / Update</button>
</form>

<hr>

<h2>All Users</h2>

    <table class="table table-striped table-bordered">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Last Name</th>
        <th>Age</th>
        <th>Delete</th>
        <th>Edit</th>
    </tr>

    <tr th:each="u : ${users}">

        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>
        <td th:text="${u.lastName}"></td>
        <td th:text="${u.age}"></td>

        <td>
            <form th:action="@{/admin/delete}" method="post">
                <input type="hidden" name="id" th:value="${u.id}">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>

        <td>
            <a th:href="@{/admin/edit(id=${u.id})}"
               class="btn btn-primary btn-sm">Edit</a>
        </td>

    </tr>
    </table>

<br>

</div>
</div>
</div>

</body>
</html>
