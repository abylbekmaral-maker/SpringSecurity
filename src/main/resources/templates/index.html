<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Spring Security Example</title>
</head>

<body>

<h1>Welcome to Index PAGE!</h1>

<h2>Edit User</h2>

<form th:action="@{/admin/save}" method="post">

    <input type="hidden" name="id" th:value="${user.id}">

    Name:
    <input type="text" name="name" th:value="${user.name}"><br>

    Last Name:
    <input type="text" name="lastName" th:value="${user.lastName}"><br>

    Age:
    <input type="number" name="age" th:value="${user.age}"><br>

    <button type="submit">Add / Update</button>
</form>

<hr>

<h2>All Users</h2>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Last Name</th>
        <th>Age</th>
        <th>Delete</th>
        <th>Edit</th>
    </tr>

    <tr th:each="u : ${users}">

        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>
        <td th:text="${u.lastName}"></td>
        <td th:text="${u.age}"></td>

        <td>
            <form th:action="@{/admin/delete}" method="post">
                <input type="hidden" name="id" th:value="${u.id}">
                <button type="submit">Delete</button>
            </form>
        </td>

        <td>
            <a th:href="@{/admin/edit(id=${u.id})}">Edit</a>
        </td>

    </tr>

</table>

<br>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
